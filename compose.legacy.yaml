# Optional one-time migration support. Not part of the native runtime.
# Use the same Compose project name as the original installation (usually assetdesk).
services:
  db:
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${DB_PASSWORD:?Use the existing legacy .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Use the existing legacy .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  bookstack:
    image: ghcr.io/linuxserver/bookstack:latest@sha256:da6324232770050b7d5f6222e8f4e223f1c688363b02ebb3c15a7546dd7133d5
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      APP_URL: ${BOOKSTACK_PUBLIC_URL:-http://localhost:6875}
      APP_KEY: ${BOOKSTACK_APP_KEY:?Use the existing legacy .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${DB_PASSWORD:?Use the existing legacy .env}
    ports:
      - "127.0.0.1:6875:80"
    volumes:
      - bookstack:/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/login]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
volumes:
  database:
  bookstack:
