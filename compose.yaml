services:
  assetdesk:
    build:
      context: .
    environment:
      INBOUND_EMAIL_TOKEN: ${INBOUND_EMAIL_TOKEN:?Run node scripts/setup.mjs}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run node scripts/setup.mjs}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL:-admin@assetdesk.local}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:?Run node scripts/setup.mjs}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      ASSET_PREFIXES: ${ASSET_PREFIXES:-ASSET,LAPTOP,DESKTOP,PC,SRV,SERVER,PRINTER,MONITOR,SW}
      SUPPORT_EMAILS: ${SUPPORT_EMAILS:-}
      DATABASE_PATH: /data/assetdesk.sqlite
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - intake:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  intake:
